 
version: '3.8'

services:
  app:
    build: .
    container_name: rick-and-morty-api
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=rickandmorty
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RICK_AND_MORTY_API_URL=https://rickandmortyapi.com/graphql
    command: npm run dev

  postgres:
    image: postgres:13-alpine
    container_name: rick-and-morty-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rickandmorty

  redis:
    image: redis:6-alpine
    container_name: rick-and-morty-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: